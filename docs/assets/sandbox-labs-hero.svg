<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">sandbox-labs</title>
  <desc id="desc">Arquitectura: Windows controla WSL2, bubblewrap contiene la carga y un proxy publica solo localhost.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1d34"/>
      <stop offset="1" stop-color="#10284a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a5b4fc" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="80" r="155" fill="#4f46e5" opacity="0.18" filter="url(#glow)"/>
  <circle cx="110" cy="380" r="130" fill="#06b6d4" opacity="0.11" filter="url(#glow)"/>

  <g transform="translate(64 68)">
    <path d="M46 0 88 16v35c0 30-18 54-42 67C22 105 4 81 4 51V16Z" fill="url(#accent)"/>
    <path d="M46 15 73 25v25c0 19-10 36-27 47-17-11-27-28-27-47V25Z" fill="#0b172a"/>
    <path d="m31 51 10 10 21-24" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="64" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">sandbox-labs</text>
  <text x="66" y="278" fill="#cbd5e1" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="23">Ejecuta lo que no controlas.</text>
  <text x="66" y="310" fill="#67e8f9" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="23" font-weight="650">Mide cuánto se contiene de verdad.</text>
  <g transform="translate(66 342)" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14" font-weight="650">
    <rect width="130" height="34" rx="17" fill="#102a43" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="19" cy="17" r="5" fill="#4ade80"/>
    <text x="33" y="22" fill="#dbeafe">WSL2 backend</text>
    <rect x="142" width="146" height="34" rx="17" fill="#102a43" stroke="#818cf8" stroke-opacity="0.45"/>
    <circle cx="161" cy="17" r="5" fill="#4ade80"/>
    <text x="175" y="22" fill="#e0e7ff">strict policies</text>
  </g>

  <g transform="translate(590 72)" font-family="Segoe UI, Inter, system-ui, sans-serif">
    <rect width="540" height="276" rx="22" fill="#07111f" fill-opacity="0.68" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="26" y="34" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.8">RUTA DE EJECUCIÓN</text>

    <g transform="translate(26 60)">
      <rect width="112" height="72" rx="14" fill="#13243b" stroke="#60a5fa" stroke-opacity="0.65"/>
      <text x="56" y="30" fill="#dbeafe" text-anchor="middle" font-size="13" font-weight="700">WINDOWS</text>
      <text x="56" y="51" fill="#93c5fd" text-anchor="middle" font-size="12">Control Center</text>
    </g>
    <path d="M148 96h46" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(204 60)">
      <rect width="112" height="72" rx="14" fill="#13243b" stroke="#a78bfa" stroke-opacity="0.65"/>
      <text x="56" y="30" fill="#ede9fe" text-anchor="middle" font-size="13" font-weight="700">WSL2</text>
      <text x="56" y="51" fill="#c4b5fd" text-anchor="middle" font-size="12">Linux kernel</text>
    </g>
    <path d="M326 96h46" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(382 60)">
      <rect width="132" height="72" rx="14" fill="#102d32" stroke="#4ade80" stroke-opacity="0.65"/>
      <text x="66" y="30" fill="#dcfce7" text-anchor="middle" font-size="13" font-weight="700">BUBBLEWRAP</text>
      <text x="66" y="51" fill="#86efac" text-anchor="middle" font-size="12">9 controles</text>
    </g>

    <path d="M448 142v39" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(280 190)">
      <rect width="234" height="58" rx="14" fill="#13243b" stroke="#38bdf8" stroke-opacity="0.65"/>
      <circle cx="24" cy="29" r="6" fill="#4ade80"/>
      <text x="42" y="25" fill="#f8fafc" font-size="13" font-weight="700">127.0.0.1 : 8801–8815</text>
      <text x="42" y="43" fill="#94a3b8" font-size="11">proxy → socket Unix → sandbox</text>
    </g>
    <g transform="translate(26 178)">
      <rect width="222" height="70" rx="14" fill="#111c2d" stroke="#64748b" stroke-opacity="0.5"/>
      <text x="18" y="27" fill="#cbd5e1" font-size="12" font-weight="700">HOST FUERA DE ALCANCE</text>
      <text x="18" y="48" fill="#64748b" font-size="11">filesystem · red · secretos · procesos</text>
    </g>
  </g>
</svg>
