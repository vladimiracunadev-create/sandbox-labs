name: Pages

# ─────────────────────────────────────────────────────────────────────────────
# Publica la portada estática de `site/` en GitHub Pages.
# `site/` es solo presentación: el Control Center nunca se publica en internet
# porque escucha en localhost y no tiene autenticación.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "site-src/**"
      - "site/_style.css"
      - "labs/**/*.md"
      - "services/**/service.json"
      - "sandbox.config.json"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Permisos mínimos a nivel de workflow; cada job amplía solo lo suyo.
permissions:
  contents: read

# Un solo despliegue a la vez; no cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar la portada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # configure-pages con enablement lo necesita
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # El sitio se genera desde el propio repositorio: catálogo, servicios y
      # README de los laboratorios. Versionar el HTML permitiría que la web
      # contradijera al repo, que es el fallo típico de un sitio mantenido aparte.
      - name: Generar el sitio
        run: node scripts/build-site.mjs

      # Un sitio a medias se publica igual de bien que uno completo, así que
      # conviene mirarlo antes de subirlo.
      - name: Comprobar que el sitio salió entero
        run: |
          set -euo pipefail
          for file in site/index.html site/conceptos.html site/labs/index.html; do
            test -s "$file" || { echo "::error::falta o está vacío: $file"; exit 1; }
          done
          labs=$(find site/labs -name '[0-9][0-9]-*.html' | wc -l)
          [ "$labs" -eq 18 ] || { echo "::error::se generaron $labs laboratorios, se esperaban 18"; exit 1; }
          for needle in "sandbox-labs" "Qué es un sandbox" "sandboxctl service up"; do
            grep -q "$needle" site/index.html || { echo "::error::falta '$needle' en la portada"; exit 1; }
          done
          # Sin hojas de estilo ni scripts externos: lo único que sale fuera es
          # el import dinámico de mermaid, que se comprueba aparte más abajo.
          if grep -Eq '<(script|link)[^>]+(src|href)="https?://' site/index.html; then
            echo "::error::la portada carga recursos externos"; exit 1
          fi
          # Mermaid llega por import() dinámico y va pinneado a una versión mayor.
          grep -q 'mermaid@11' site/labs/04-linux-namespaces.html             || { echo "::error::el import de mermaid no está pinneado"; exit 1; }
          {
            echo "### 🌐 Sitio publicado"
            echo ""
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Páginas | **$(find site -name '*.html' | wc -l)** |"
            echo "| Laboratorios | **$labs** |"
            echo "| Portada | **$(wc -c < site/index.html) bytes** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
