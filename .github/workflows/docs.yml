name: Docs
on:
  push:
    paths: ["**/*.md", "scripts/check-doc-links.mjs"]
  pull_request:
    paths: ["**/*.md", "scripts/check-doc-links.mjs"]
permissions: { contents: read }
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-doc-links.mjs
