name: Docs

# ─────────────────────────────────────────────────────────────────────────────
# Salud de la documentación. Dos comprobaciones que fallan por motivos
# distintos y por eso van separadas:
#   links → un enlace relativo apunta a un archivo que ya no existe.
#   lint  → el Markdown se desvía del estilo fijado en .markdownlint.json.
# Se dispara solo cuando cambia documentación o su configuración.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "scripts/check-doc-links.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "scripts/check-doc-links.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Enlaces internos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verificar enlaces relativos
        run: node scripts/check-doc-links.mjs

  lint:
    name: Lint de Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules/**/*.md
