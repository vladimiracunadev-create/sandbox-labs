name: Security

# ─────────────────────────────────────────────────────────────────────────────
# Auditoría de cadena de suministro. Corre en cada push a main, en cada PR y
# semanalmente: una dependencia sin cambios puede tener un CVE nuevo mañana.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencias (cargo-audit · pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La versión de pnpm viene de `packageManager` en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Auditar el árbol npm
        run: pnpm audit --audit-level high

      # Cargo.lock está versionado: se audita el mismo árbol que compila CI.
      - name: Auditar el árbol Cargo
        uses: actions-rust-lang/audit@v1

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Detectar secretos en el historial
        run: gitleaks detect --redact -v --source .

  workflows:
    name: Workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar los propios workflows
        run: |
          set -euo pipefail
          python -m pip install --quiet zizmor
          zizmor --persona=regular .github/workflows/
