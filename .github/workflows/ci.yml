name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Puerta de calidad del repositorio. Tres trabajos independientes:
#   rust  → formato, lint, pruebas de contrato y humo del CLI sandboxctl.
#   node  → validadores del catálogo y suite del Control Center.
#   panel → arranca el servidor real y comprueba la API de extremo a extremo.
# Los tres corren los mismos comandos que `make check` en local.
#
# Todas las acciones van fijadas a SHA: un tag es mutable y `@v5` puede
# apuntar mañana a otro código. zizmor lo verifica en el workflow Security.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · tests · CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `components` debe ser una cadena: en formato de flujo YAML,
      # `{ components: rustfmt, clippy }` se lee como dos claves y la acción
      # ignora clippy en silencio.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cachear dependencias de Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Cargo.lock está versionado: `--locked` falla si el build lo cambiaría.
      - name: Verificar que Cargo.lock está al día
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Pruebas
        run: cargo test --workspace --locked

      - name: Humo — validación de política y carga
        run: cargo run --locked -p sandboxctl -- validate policies/minimal.json --workload workloads/benign/hello

      - name: Humo — plan y evidencia en dry-run
        run: cargo run --locked -p sandboxctl -- run --workload workloads/benign/hello --runtime dry-run --policy policies/minimal.json

      - name: Humo — la evidencia generada cumple el esquema
        run: node scripts/validate-evidence.mjs

      - name: Resumen
        if: always()
        run: |
          {
            echo "### 🦀 Rust"
            echo ""
            echo "- Toolchain: \`$(rustc --version)\`"
            echo "- Evidencias generadas: **$(find evidence/runs -name '*.json' | wc -l)**"
          } >> "$GITHUB_STEP_SUMMARY"

  node:
    name: Node (catálogo · Control Center)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `version`: la fija `packageManager` en package.json. Declararla en
      # los dos sitios hace fallar la acción por conflicto.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Suite completa
        run: pnpm check

      - name: Build del Control Center
        run: pnpm dashboard:build

      # El build es determinista (copia src/ a dist/ reescribiendo imports):
      # si dist/ versionado difiere del generado, alguien olvidó regenerarlo.
      - name: Verificar que dist/ versionado está al día
        run: |
          set -euo pipefail
          if ! git diff --quiet -- control-center/dist; then
            echo "::error::control-center/dist está desincronizado. Ejecuta 'pnpm dashboard:build' y commitea."
            git --no-pager diff --stat -- control-center/dist
            exit 1
          fi
          echo "dist/ coincide con src/."

  # ───────────────────────────────────────────────────────────────────────────
  # El trabajo que sostiene todo lo que el repositorio afirma.
  #
  # Los demás verifican que el código compila y que el plan es coherente. Este
  # instala los runtimes de verdad, lanza cargas que INTENTAN salirse del
  # sandbox y comprueba que no lo consiguen. Sin él, «aísla» sería una palabra
  # en un README.
  # ───────────────────────────────────────────────────────────────────────────
  isolation:
    name: Aislamiento real (bubblewrap · unshare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-isolation-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-isolation-${{ runner.os }}-

      - name: Instalar los runtimes de aislamiento
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap util-linux
          bwrap --version
          unshare --version
          prlimit --version

      # Ubuntu 24.04 trae `kernel.apparmor_restrict_unprivileged_userns=1`: los
      # binarios sin perfil de AppArmor no pueden crear user namespaces. Sin
      # userns propio, bubblewrap crea el network namespace sin CAP_NET_ADMIN
      # sobre él y muere al levantar loopback:
      #
      #   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      #
      # Aquí se levanta la restricción porque el runner es efímero y su único
      # trabajo es medir contención. En una máquina real la respuesta correcta
      # es la contraria: dejar el sysctl como está y usar el perfil de AppArmor
      # que trae el paquete.
      - name: Permitir user namespaces sin privilegios en el runner
        run: |
          set -euo pipefail
          key=kernel.apparmor_restrict_unprivileged_userns
          if sysctl -n "$key" > /dev/null 2>&1; then
            echo "antes: $(sysctl -n "$key")"
            sudo sysctl -w "$key=0"
          else
            echo "$key no existe en este kernel: nada que hacer"
          fi
          # Comprobación directa: si esto falla, la suite no podrá medir nada.
          unshare --user --map-root-user true && echo "user namespaces disponibles"

      - name: Inventario del host
        run: cargo run --locked -q -p sandboxctl -- doctor

      - name: Suite de contención — bubblewrap debe contenerlo todo
        run: |
          set -euo pipefail
          # `--strict` devuelve 1 si alguna sonda escapa: si bubblewrap deja de
          # contener una dimensión, el build se cae aquí y no en producción.
          cargo run --locked -q -p sandboxctl -- escape \
            --runtime bwrap --strict --report evidence/escape/bwrap.json

      - name: Suite de contención — unshare debe cortar la red y los PIDs
        run: |
          set -euo pipefail
          # unshare no ofrece jaula de filesystem y se documenta así, pero red y
          # visibilidad de procesos sí tienen que quedar contenidas.
          #
          # `--skip-if-unmeasurable` se mantiene por si el runner cambia y vuelve
          # a restringir los user namespaces: en ese caso unshare no llega a
          # arrancar, y eso no es una fuga sino ausencia de medición. La puerta
          # dura la sostiene bubblewrap, que sí falla si no midió nada.
          cargo run --locked -q -p sandboxctl -- escape \
            --runtime unshare --json --report evidence/escape/unshare.json > /dev/null
          node scripts/assert-containment.mjs evidence/escape/unshare.json \
            --contained network,process --skip-if-unmeasurable

      - name: Línea base — native debe ESCAPAR (si no, la suite no mide nada)
        env:
          SANDBOX_LABS_ALLOW_NATIVE: "1"
        run: |
          set -euo pipefail
          # Contraprueba deliberada: sin aislamiento las sondas TIENEN que
          # escaparse. Si aquí saliera todo contenido, no estarían midiendo nada
          # y los ✅ de bubblewrap no valdrían nada.
          cargo run --locked -q -p sandboxctl -- escape \
            --runtime native --json --report evidence/escape/native.json > /dev/null
          node scripts/assert-containment.mjs evidence/escape/native.json --expect-escape

      - name: Comparativa de coste entre fronteras
        run: cargo run --locked -q -p sandboxctl -- bench --repeat 15 --report evidence/escape/bench.json

      - name: Publicar la matriz en el resumen
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## 🛡️ Matriz de contención"
            echo ""
            echo "Medida en este runner, no declarada en un documento."
            echo ""
            echo '```'
            cargo run --locked -q -p sandboxctl -- escape --runtime bwrap --runtime unshare 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: containment-reports
          path: evidence/escape/
          retention-days: 14

  panel:
    name: Panel (API de extremo a extremo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [rust, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Construir el panel
        run: node control-center/scripts/build.mjs

      # Sin CLI compilado: se ejercita la ruta de evidencia de reserva, que es
      # la que ve cualquiera que arranque el panel sin toolchain de Rust.
      - name: Arrancar el panel
        env:
          SANDBOX_LABS_CLI_FALLBACK: "off"
        run: |
          set -euo pipefail
          node control-center/dist/server.js &
          echo $! > /tmp/panel.pid
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9093/api/system > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:9093/api/system > /dev/null

      - name: Comprobar el contrato de la API
        run: |
          set -euo pipefail
          base=http://127.0.0.1:9093

          echo "--- el panel se declara en modo seguro ---"
          curl -sf "$base/api/system" | grep -q '"executionModel": "registered-workloads-only"'

          echo "--- una escritura sin cabecera de confianza se rechaza ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/jobs" \
            -H 'content-type: application/json' \
            -d '{"workloadId":"hello","policyId":"minimal","runtimeId":"dry-run","arguments":[]}')
          [ "$code" = "403" ] || { echo "::error::se esperaba 403, llegó $code"; exit 1; }

          echo "--- no existe endpoint de comandos arbitrarios ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/exec" \
            -H 'x-sandbox-request: 1' -d '{}')
          [ "$code" = "404" ] || { echo "::error::se esperaba 404, llegó $code"; exit 1; }

          echo "--- un Host no confiable se bloquea (anti DNS-rebinding) ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' "$base/api/system")
          [ "$code" = "421" ] || { echo "::error::se esperaba 421, llegó $code"; exit 1; }

          echo "--- un trabajo registrado llega a estado terminal con evidencia ---"
          job=$(curl -sf -X POST "$base/api/jobs" \
            -H 'content-type: application/json' -H 'x-sandbox-request: 1' \
            -d '{"workloadId":"hello","policyId":"minimal","runtimeId":"dry-run","arguments":[]}' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).id))')
          for _ in $(seq 1 40); do
            status=$(curl -sf "$base/api/jobs/$job" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).status))')
            [ "$status" = "planned" ] && break
            sleep 0.5
          done
          [ "$status" = "planned" ] || { echo "::error::el trabajo terminó en $status"; exit 1; }
          echo "Todas las comprobaciones del panel pasaron."

      - name: Detener el panel
        if: always()
        run: kill "$(cat /tmp/panel.pid)" 2>/dev/null || true
